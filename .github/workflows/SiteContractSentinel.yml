# .github/workflows/SiteContractSentinel.yml
name: Site Contract Sentinel

# ADR-035 Phase 2: independent canary. Fetches a small fixed set of pinned
# javdb pages between daily runs and raises a site_drift OpsIncident on drift,
# giving lead time before the next DailyIngestion run gates.

permissions:
  contents: read

on:
  # Scheduled canary disabled — run manually via workflow_dispatch only.
  # schedule:
  #   # Every 6h (00/06/12/18 UTC). The 06:00 run lands well before the 12:00 UTC
  #   # DailyIngestion, so drift is flagged with lead time.
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type. Use the same tier DailyIngestion uses to reach javdb.'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - 'ubuntu-latest'
          - 'self-hosted'
      mode:
        description: 'canary = site-contract drift check; index-probe = daily index freshness measurement'
        required: false
        default: 'canary'
        type: choice
        options:
          - 'canary'
          - 'index-probe'
      probe_pages:
        description: 'index-probe only: how many index pages to scan'
        required: false
        default: '30'
        type: string
      probe_use_cookie:
        description: 'index-probe only: send the JavDB session cookie. Off by default so the probe sees what the daily spider sees (its index fetch is anonymous too).'
        required: false
        default: false
        type: boolean

concurrency:
  group: site-contract-sentinel
  cancel-in-progress: false

jobs:
  canary:
    name: Canary
    if: inputs.mode != 'index-probe'
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 20
    environment: Production
    env:
      TZ: Asia/Singapore
      STORAGE_BACKEND: d1
      D1_RECOVERY_OUTBOX_ENABLED: ${{ vars.D1_RECOVERY_OUTBOX_ENABLED || 'false' }}
      D1_CIRCUIT_BREAKER_ENABLED: ${{ vars.D1_CIRCUIT_BREAKER_ENABLED || 'true' }}
      D1_BATCHING_ENABLED: ${{ vars.D1_BATCHING_ENABLED || 'false' }}
      D1_STARTUP_REPLAY_ENABLED: ${{ vars.D1_STARTUP_REPLAY_ENABLED || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: false
          lfs: true

      - name: Set up Python, venv, dependencies, Rust extension
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Generate config.py from GitHub Variables and Secrets
        env:
          # Proxy (the canary fetches javdb through the spider's proxy pool).
          VAR_PROXY_MODE: ${{ vars.PROXY_MODE }}
          VAR_PROXY_POOL_JSON: ${{ secrets.PROXY_POOL_JSON }}
          VAR_PROXY_MODULES_JSON: ${{ vars.PROXY_MODULES_JSON }}
          VAR_PROXY_POOL_MAX_FAILURES: ${{ vars.PROXY_POOL_MAX_FAILURES || 3 }}
          VAR_LOGIN_PROXY_NAME: ${{ vars.LOGIN_PROXY_NAME || '' }}
          # Cloudflare bypass (canary uses use_cf_bypass=True, matching DailyIngestion).
          VAR_CF_BYPASS_SERVICE_PORT: ${{ vars.CF_BYPASS_SERVICE_PORT || '8000' }}
          VAR_CF_BYPASS_ENABLED: ${{ vars.CF_BYPASS_ENABLED || 'True' }}
          # BFR-024: the bypass service binds to loopback on each proxy host, so
          # the runner must tunnel through the proxy to 127.0.0.1:{port} instead
          # of dialling {proxy_ip}:{port}. Without this the canary's every fetch
          # times out and it reports a fetch failure rather than real site drift.
          VAR_CF_BYPASS_VIA_PROXY: ${{ vars.CF_BYPASS_VIA_PROXY || 'False' }}
          VAR_CF_BYPASS_PORT_MAP_JSON: ${{ vars.CF_BYPASS_PORT_MAP_JSON || '{}' }}
          # JavDB login (cookie-based fetch, matches DailyIngestion).
          VAR_JAVDB_USERNAME: ${{ secrets.JAVDB_USERNAME }}
          VAR_JAVDB_PASSWORD: ${{ secrets.JAVDB_PASSWORD }}
          VAR_JAVDB_SESSION_COOKIE: ${{ secrets.JAVDB_SESSION_COOKIE }}
          # Base URL and request timeout for javdb fetches.
          VAR_BASE_URL: ${{ vars.BASE_URL || 'https://javdb.com' }}
          VAR_REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT || '30' }}
          # Optional canary tuning (pinned index URL + golden anchors JSON).
          VAR_SENTINEL_CANARY_INDEX_URL: ${{ vars.SENTINEL_CANARY_INDEX_URL || '' }}
          VAR_SENTINEL_CANARY_ANCHORS_JSON: ${{ vars.SENTINEL_CANARY_ANCHORS_JSON || '' }}
          # D1 / Cloudflare — baseline read + incident write land in the reports DB.
          VAR_STORAGE_BACKEND: d1
          VAR_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAR_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAR_D1_HISTORY_DB_ID: ${{ secrets.D1_HISTORY_DB_ID }}
          VAR_D1_REPORTS_DB_ID: ${{ secrets.D1_REPORTS_DB_ID }}
          VAR_D1_OPERATIONS_DB_ID: ${{ secrets.D1_OPERATIONS_DB_ID }}
          VAR_REPORTS_DIR: ${{ vars.REPORTS_DIR || 'reports' }}
          VAR_LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: python3 -m apps.cli.ops.config_generator --github-actions

      - name: Run site-contract canary
        id: canary
        run: |
          set -o pipefail
          mkdir -p logs
          # Do NOT `set -e`: exit 4 (critical drift) is an expected outcome we
          # want to record, not a step crash. Capture the code explicitly.
          STORAGE_BACKEND=d1 python3 -m apps.cli.ops.sentinel \
            --canary --json --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee logs/sentinel_canary.jsonl
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # 0 = clean, 4 = critical drift (recorded as a site_drift incident); both
          # are "ran ok". Anything else FAILS the step so the operator is alerted:
          #   3 = canary could not do its job (fetched nothing, or the incident
          #       write failed — drift would otherwise be lost silently)
          #   1 = unexpected internal error.
          if [ "$CODE" = "0" ] || [ "$CODE" = "4" ]; then exit 0; fi
          exit "$CODE"

      - name: Upload canary log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-contract-sentinel-log
          path: logs/sentinel_canary.jsonl
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Site Contract Sentinel (canary)"
            echo ""
            echo "- Storage backend: d1"
            echo "- Sentinel exit code: ${{ steps.canary.outputs.exit_code }} (0=clean, 4=critical drift, 3=canary fetch/write failure, 1=internal error)"
            echo ""
            if [ -f logs/sentinel_canary.jsonl ]; then
              echo "Last output line:"
              echo '```json'
              tail -n 1 logs/sentinel_canary.jsonl
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Index freshness probe (design support for dynamic daily pagination).
  # Read-only measurement run: no drift evaluation, no incident writes, no D1.
  # Mirrors IndexProbe.yml, which becomes the permanent home once it is on main
  # (a workflow must exist on the default branch to be dispatchable).
  # ---------------------------------------------------------------------------
  index-probe:
    name: Index freshness probe
    if: inputs.mode == 'index-probe'
    # Honour the runner input; default to the tier DailyIngestion uses, which is
    # ubuntu-latest — the canary's self-hosted default would strand the probe on
    # a runner this repo does not keep online for ingestion.
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: Production
    env:
      TZ: Asia/Singapore

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python, venv, dependencies, Rust extension
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'

      - name: Generate config.py from GitHub Variables and Secrets
        env:
          VAR_PROXY_MODE: ${{ vars.PROXY_MODE }}
          VAR_PROXY_POOL_JSON: ${{ secrets.PROXY_POOL_JSON }}
          VAR_PROXY_MODULES_JSON: ${{ vars.PROXY_MODULES_JSON }}
          VAR_PROXY_POOL_MAX_FAILURES: ${{ vars.PROXY_POOL_MAX_FAILURES || 3 }}
          VAR_PROXY_SPIDER_ENABLED: 'true'
          VAR_LOGIN_PROXY_NAME: ${{ vars.LOGIN_PROXY_NAME || '' }}
          VAR_CF_BYPASS_SERVICE_PORT: ${{ vars.CF_BYPASS_SERVICE_PORT || '8000' }}
          VAR_CF_BYPASS_ENABLED: ${{ vars.CF_BYPASS_ENABLED || 'True' }}
          # BFR-024: the bypass service binds to loopback on each proxy host, so
          # the runner must tunnel through the proxy instead of dialling the
          # proxy IP directly. Without this every probe fetch pays the fallback
          # cascade (~2 min/page) before it succeeds.
          VAR_CF_BYPASS_VIA_PROXY: ${{ vars.CF_BYPASS_VIA_PROXY || 'False' }}
          VAR_CF_BYPASS_PORT_MAP_JSON: ${{ vars.CF_BYPASS_PORT_MAP_JSON || '{}' }}
          # JavDB login, for the optional probe_use_cookie run. The badges do
          # NOT require a session — a 2026-08-08 anonymous probe saw 193 of
          # them; an earlier probe that saw none had run at 03:00 local, before
          # the day's torrents landed.
          VAR_JAVDB_USERNAME: ${{ secrets.JAVDB_USERNAME }}
          VAR_JAVDB_PASSWORD: ${{ secrets.JAVDB_PASSWORD }}
          VAR_JAVDB_SESSION_COOKIE: ${{ secrets.JAVDB_SESSION_COOKIE }}
          VAR_BASE_URL: ${{ vars.BASE_URL || 'https://javdb.com' }}
          VAR_REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT || '30' }}
          VAR_PHASE2_MIN_RATE: ${{ vars.PHASE2_MIN_RATE }}
          VAR_PHASE2_MIN_COMMENTS: ${{ vars.PHASE2_MIN_COMMENTS }}
          VAR_IGNORE_RELEASE_DATE_FILTER: ${{ vars.IGNORE_RELEASE_DATE_FILTER || 'False' }}
          # Mirrors IndexProbe.yml: the stop-rule simulation runs the real
          # PageScanPolicy against these bounds and reports whether the live
          # daily scan uses the rule, so they must match DailyIngestion or it
          # describes a scan nobody runs.
          VAR_PAGE_START: ${{ vars.PAGE_START }}
          VAR_PAGE_END: ${{ vars.PAGE_END }}
          VAR_PAGE_SCAN_DYNAMIC: ${{ vars.PAGE_SCAN_DYNAMIC || 'True' }}
          VAR_PAGE_SCAN_MAX: ${{ vars.PAGE_SCAN_MAX || '30' }}
          VAR_PAGE_SCAN_STOP_AFTER: ${{ vars.PAGE_SCAN_STOP_AFTER || '2' }}
          VAR_REPORTS_DIR: ${{ vars.REPORTS_DIR || 'reports' }}
          VAR_LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: python3 -m apps.cli.ops.config_generator --github-actions

      - name: Run index freshness probe
        env:
          INPUT_PAGES: ${{ inputs.probe_pages }}
          INPUT_USE_COOKIE: ${{ inputs.probe_use_cookie }}
        run: |
          set -o pipefail
          mkdir -p logs
          COOKIE_ARGS=()
          if [ "$INPUT_USE_COOKIE" = "true" ]; then COOKIE_ARGS+=(--use-cookie); fi
          python3 -m apps.cli.ops.index_probe \
            "${COOKIE_ARGS[@]}" \
            --pages "${INPUT_PAGES:-30}" \
            --delay 1.0 \
            --max-seconds 1500 \
            --save-html logs/probe-html \
            --json logs/index_probe.json 2>&1 | tee logs/index_probe.log

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: index-freshness-probe
          path: |
            logs/index_probe.json
            logs/index_probe.log
            logs/probe-html/
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Index Freshness Probe"
            echo ""
            if [ -f logs/index_probe.json ]; then
              echo '```json'
              python3 -c "import json;print(json.dumps(json.load(open('logs/index_probe.json'))['summary'], indent=2, ensure_ascii=False))"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
