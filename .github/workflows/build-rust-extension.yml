name: Build Rust Extension

# This workflow builds the Rust extension wheel and caches it.
# It can be triggered standalone on push, manually, or called by other workflows.
#
# Two parallel jobs, each pinned to a self-hosted runner of its architecture.
# The fleet tags boxes only with the default labels (self-hosted / Linux /
# X64|ARM64), so the array form `[self-hosted, <arch>]` is required to keep an
# ARM build off an x64 box and vice versa:
#   - build-x64: runs on [self-hosted, X64]
#   - build-arm: runs on [self-hosted, ARM64]; continue-on-error so a busy or
#     unavailable ARM box never blocks the x64 build or the push status.
# install-rust-wheel produces an abi3, zig-linked manylinux wheel, so each job
# warms the per-arch actions/cache (keyed by runner.arch) that the ingestion
# and test workflows restore instead of rebuilding from source.

on:
  push:
    branches:
      - main
      - dev
      - feature/**
    paths:
      - 'javdb/rust_core/**'
      - '.github/workflows/build-rust-extension.yml'
      - '.github/actions/install-rust-wheel/**'
      - '.github/actions/setup-python-env/**'
      - '.github/actions/ensure-python/**'
      - '.github/actions/restore-encrypted-config/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =============================================================================
  # x64 build (self-hosted, X64)
  # =============================================================================
  build-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Singapore

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # No post-checkout git ops (build + upload only); don't leave
          # GITHUB_TOKEN on disk where an artifact upload could capture it.
          persist-credentials: false

      - name: Ensure Python in runner tool cache
        uses: ./.github/actions/ensure-python
        with:
          python-version: '3.11'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Build and cache Rust wheel
        uses: ./.github/actions/install-rust-wheel

      - name: Sanitize branch name
        id: branch
        run: echo "name=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9._-]/-/g')" >> $GITHUB_OUTPUT

      - name: Upload Rust extension wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-extension-wheel-x64-${{ github.sha }}
          path: ${{ runner.temp }}/rust-wheel/*.whl
          retention-days: 30

      - name: Upload Rust extension wheel artifact (branch latest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-extension-wheel-x64-latest-${{ steps.branch.outputs.name }}
          path: ${{ runner.temp }}/rust-wheel/*.whl
          retention-days: 7

      # Rust/Python value-parity drift detection retired by ADR-041: the
      # pure-Python parsers under javdb/parsing/fallback/ are now best-effort
      # (shape-contracted, not byte-equal to Rust). Shape is covered by
      # tests/unit/test_fallback_shape.py in the unit suite.

  # =============================================================================
  # ARM64 build (self-hosted, ARM64)
  # continue-on-error: an unavailable ARM runner must not block x64 or the push.
  # =============================================================================
  build-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    continue-on-error: true
    env:
      TZ: Asia/Singapore

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # No post-checkout git ops (build + upload only); don't leave
          # GITHUB_TOKEN on disk where an artifact upload could capture it.
          persist-credentials: false

      - name: Ensure Python in runner tool cache
        uses: ./.github/actions/ensure-python
        with:
          python-version: '3.11'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Build and cache Rust wheel
        uses: ./.github/actions/install-rust-wheel

      - name: Sanitize branch name
        id: branch
        run: echo "name=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9._-]/-/g')" >> $GITHUB_OUTPUT

      - name: Upload Rust extension wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-extension-wheel-arm-${{ github.sha }}
          path: ${{ runner.temp }}/rust-wheel/*.whl
          retention-days: 30

      - name: Upload Rust extension wheel artifact (branch latest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-extension-wheel-arm-latest-${{ steps.branch.outputs.name }}
          path: ${{ runner.temp }}/rust-wheel/*.whl
          retention-days: 7
