name: 'Install Rust Wheel'
description: 'Build or restore cached javdb_rust_core wheel and install it into the current Python environment'

outputs:
  cache-hit:
    description: 'Whether the wheel was restored from cache'
    value: ${{ steps.wheel-cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Detect pip command
      id: pip
      shell: bash
      run: |
        python_from_pip() {
          local pip_bin="$1"
          local ver
          ver=$("$pip_bin" -V 2>&1 | sed -n 's/.*([Pp]ython \([0-9.]*\)).*/\1/p')
          if [[ -n "$ver" ]] && command -v "python${ver}" &>/dev/null; then
            echo "python${ver}"
          else
            echo "python3"
          fi
        }
        if command -v pip &>/dev/null; then
          pip_cmd="pip"
          python_cmd="$(python_from_pip pip)"
        elif command -v pip3 &>/dev/null; then
          pip_cmd="pip3"
          python_cmd="$(python_from_pip pip3)"
        else
          pip_cmd="python3 -m pip"
          python_cmd="python3"
        fi
        echo "cmd=${pip_cmd}" >> "$GITHUB_OUTPUT"
        echo "python_cmd=${python_cmd}" >> "$GITHUB_OUTPUT"
        echo "python_version=$("${python_cmd}" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_OUTPUT"

    - name: Clean wheel staging dir
      shell: bash
      run: |
        # Stage the wheel under $RUNNER_TEMP (runner-owned, inside _work),
        # not /tmp: actions/cache extracts relative to the workspace, so a
        # top-level /tmp path made restore try to recreate the root-owned
        # /tmp dir ("mkdir: Permission denied") — turning every cache hit
        # into a miss + full rebuild. Persistent runners may also keep a
        # stale wheel across jobs, which would make the install glob
        # ambiguous (ResolutionImpossible on two same-version wheels), so
        # clear it first.
        rm -rf "${RUNNER_TEMP}/rust-wheel"

    - name: Restore Rust wheel from cache
      id: wheel-cache
      # restore-only: the combined actions/cache post step saves even when
      # the build failed, which poisoned keys with empty or mixed dirs on
      # persistent runners. Saving is an explicit success-gated step below.
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ runner.temp }}/rust-wheel
        # The crate builds an abi3-py39 wheel (cp39-abi3 tag), so one wheel
        # per OS/arch serves every Python >= 3.9 — keying by Python version
        # would force needless rebuilds on machines without a C toolchain.
        # `-v2` salt: the pre-existing keys were archived from a /tmp path
        # and are unusable after the move to $RUNNER_TEMP (cache keys are
        # immutable, so the old archive would still extract toward /tmp).
        # Bumping the salt forces a clean one-time rebuild under the new path.
        key: rust-wheel-v2-${{ runner.os }}-${{ runner.arch }}-abi3-${{ hashFiles('javdb/rust_core/src/**', 'javdb/rust_core/Cargo.toml', 'javdb/rust_core/Cargo.lock') }}

    - name: Install from cached wheel
      if: steps.wheel-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        shopt -s nullglob
        wheels=("${RUNNER_TEMP}/rust-wheel"/*.whl)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "::error::install-rust-wheel: cached entry holds ${#wheels[@]} wheels (expected exactly 1) — delete the cache key and re-run: gh cache delete 'rust-wheel-v2-${{ runner.os }}-${{ runner.arch }}-abi3-*'"
          exit 1
        fi
        ${{ steps.pip.outputs.cmd }} install "${wheels[0]}"
        echo "✓ Installed Rust extension from cache"

    - name: Install Rust toolchain
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo dependencies
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          javdb/rust_core/target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('javdb/rust_core/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-

    - name: Build Rust extension wheel
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # ziglang provides the linker for `maturin build --zig`: several
        # self-hosted fleet machines have no system C toolchain (rustc
        # otherwise dies with "linker `cc` not found"), and zig links
        # against a portable glibc floor so the wheel works fleet-wide.
        # Pinned like the other bootstrap tools in this repo; bump
        # deliberately together with a local `maturin build --zig` check.
        ${{ steps.pip.outputs.cmd }} install maturin[patchelf] ziglang==0.16.0
        # Rebuild the output dir from scratch so it holds exactly the one
        # wheel this build produces (the leading clean step already cleared
        # any cross-job leftovers; this also covers a same-job retry).
        rm -rf "${RUNNER_TEMP}/rust-wheel"
        mkdir -p "${RUNNER_TEMP}/rust-wheel"
        cd javdb/rust_core
        # User installs (common on self-hosted) put scripts in ~/.local/bin, which is often not on PATH.
        export PATH="${HOME}/.local/bin:${PATH}"
        # maturin --zig only wires zig in as the TARGET linker
        # (CARGO_TARGET_APPLIES_TO_HOST=false); build scripts and
        # proc-macros are HOST artifacts and still link via plain `cc`.
        # On machines without one, shim cc to zig — the explicit -target
        # makes zig use its bundled libc instead of system dev files.
        if ! command -v cc >/dev/null 2>&1; then
          case "$(uname -m)" in
            aarch64) ZIG_NATIVE_TARGET="aarch64-linux-gnu" ;;
            x86_64)  ZIG_NATIVE_TARGET="x86_64-linux-gnu" ;;
            *)
              echo "::error::install-rust-wheel: no system cc and unsupported arch '$(uname -m)' for the zig shim"
              exit 1
              ;;
          esac
          CC_SHIM_DIR="$(mktemp -d)"
          {
            echo '#!/usr/bin/env bash'
            echo "exec ${{ steps.pip.outputs.python_cmd }} -m ziglang cc -target ${ZIG_NATIVE_TARGET} \"\$@\""
          } > "${CC_SHIM_DIR}/cc"
          chmod +x "${CC_SHIM_DIR}/cc"
          export PATH="${CC_SHIM_DIR}:${PATH}"
          echo "No system cc — shimming the host linker to zig (${ZIG_NATIVE_TARGET})"
        fi
        ${{ steps.pip.outputs.python_cmd }} -m maturin build --release --zig --out "${RUNNER_TEMP}/rust-wheel"
        echo "✓ Built Rust extension wheel:"
        ls -lh "${RUNNER_TEMP}/rust-wheel"/*.whl

    - name: Install built wheel
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        shopt -s nullglob
        wheels=("${RUNNER_TEMP}/rust-wheel"/*.whl)
        if [ "${#wheels[@]}" -ne 1 ]; then
          echo "::error::install-rust-wheel: build produced ${#wheels[@]} wheels in ${RUNNER_TEMP}/rust-wheel (expected exactly 1)"
          exit 1
        fi
        ${{ steps.pip.outputs.cmd }} install "${wheels[0]}"
        echo "✓ Installed Rust extension from freshly built wheel"

    - name: Save Rust wheel to cache
      # Explicit, success-gated save (paired with the restore-only step
      # above). Composite steps abort on first failure, so reaching here
      # means the build and install succeeded — we never persist a partial
      # or empty staging dir, which is what poisoned keys before.
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ runner.temp }}/rust-wheel
        key: ${{ steps.wheel-cache.outputs.cache-primary-key }}
